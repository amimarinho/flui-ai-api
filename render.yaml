services:
  - type: web
    name: flui-ai-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/src/main
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flui-ai
          property: connectionString

databases:
  - name: flui-ai
    plan: free
    postgresMajorVersion: "16"
    databaseName: flui_ai
    user: flui
